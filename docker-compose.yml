version: "3.8"

services:
  campus-navigator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accessible-campus-navigator
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - CAMPUS_ENV=production
      - CAMPUS_PORT=8501
      - CAMPUS_DB_JOURNAL_MODE=WAL
      - CAMPUS_LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./backups:/app/backups
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - campus-net

networks:
  campus-net:
    driver: bridge
