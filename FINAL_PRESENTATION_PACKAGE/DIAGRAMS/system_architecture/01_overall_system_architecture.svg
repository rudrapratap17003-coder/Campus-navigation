  <text x="40" y="37" fill="#F1F5F9" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">01 — Overall System Architecture</text>
  <text x="1176" y="37" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Accessible Campus Navigator • JAIN (Deemed-to-be University)</text>

  <!-- Main Content -->
  
    <!-- Layer 1: Presentation Layer -->
    <rect x="50" y="90" width="1100" height="150" rx="12" fill="url(#cardGrad)" stroke="#1E3B32" stroke-width="2" filter="url(#shadow)"/>
