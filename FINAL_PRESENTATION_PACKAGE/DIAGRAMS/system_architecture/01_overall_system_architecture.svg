      <stop offset="0%" stop-color="#080F0D"/>
      <stop offset="100%" stop-color="#11221C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142620"/>
      <stop offset="100%" stop-color="#1A332B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0C1A15"/>
